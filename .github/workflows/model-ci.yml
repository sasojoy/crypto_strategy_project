name: Model CI

on:
  push:
    branches:
      - main
      - work
      - "ci/**"
  pull_request:
    paths:
      - '.github/workflows/model-ci.yml'
      - 'scripts/**'
      - 'resources/**'
      - 'csp/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  schedule:
    - cron: '0 3 * * 1'   # 每週一 03:00 UTC
  workflow_dispatch:

jobs:
  auto-train-backtest:
    runs-on: ubuntu-latest

    # 將 secrets 先映射到 env，供步驟與 if: 安全取用（避免 "Unrecognized named-value: 'secrets'"）
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      SSH_HOST:           ${{ secrets.SSH_HOST }}
      SSH_USER:           ${{ secrets.SSH_USER }}
      SSH_KEY:            ${{ secrets.SSH_KEY }}
      SSH_PORT:           ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install xgboost scikit-learn joblib pandas numpy requests

      - name: Run CI orchestrator
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_orchestrator \
            --csv resources/btc_15m.csv \
            --feature-func csp.features.h16.build_features_15m_4h \
            --models-dir models/ci \
            --artifacts-dir artifacts/ci \
            --target-metric roc_auc \
            --target-value 0.55 \
            --output logs/ci_run.json \
            --notify on_fail

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        with:
          name: model-ci-logs
          path: |
            logs/ci_run.json
            logs/threshold_report.json
          if-no-files-found: warn

      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: model-ci-models
          path: models/ci
          if-no-files-found: warn

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-ci-artifacts
          path: artifacts/ci
          if-no-files-found: warn

      # 部署後觸發你的 server 跑 daily pipeline（只有 SSH_* 存在才會執行）
      - name: Preflight SSH env (skip if empty)
        id: preflight_ssh
        run: |
          ok=1
          [ -n "${SSH_HOST:-}" ] || ok=0
          [ -n "${SSH_USER:-}" ] || ok=0
          [ -n "${SSH_KEY:-}"  ] || ok=0
          echo "has_ssh=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "1" ]; then
            echo "::warning::SSH_* not set; server trigger will be skipped."
          fi
      - name: Start SSH agent
        if: ${{ success() && steps.preflight_ssh.outputs.has_ssh == '1' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}
      - name: Add host to known_hosts
        if: ${{ success() && steps.preflight_ssh.outputs.has_ssh == '1' }}
        run: |
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
      - name: Trigger daily pipeline on server (post-deploy)
        if: ${{ success() && steps.preflight_ssh.outputs.has_ssh == '1' }}
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_USER: ${{ env.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          PORT_OPT=""
          if [ -n "${SSH_PORT:-}" ]; then PORT_OPT="-p ${SSH_PORT}"; fi
          # 把 TELEGRAM_* 以環境變數傳給遠端；GitHub 會自動遮罩日誌
          ssh -o StrictHostKeyChecking=yes $PORT_OPT "${SSH_USER}@${SSH_HOST}" " \
            set -euo pipefail; \
            export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN:-}'; \
            export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID:-}'; \
            DST='/opt/crypto_strategy_project'; \
            if [ ! -d \"\$DST\" ]; then \
              echo '::error::Server path '\$DST' not found. Run Train-Backtest-Deploy first.' >&2; exit 1; \
            fi; \
            cd \"\$DST\"; \
            if [ -d .git ]; then git pull --rebase || true; else echo '::notice::Not a git repo, skip pull'; fi; \
            # === bootstrap venv & deps ===
            if [ ! -x .venv/bin/python ]; then python3 -m venv .venv; fi; \
            ./.venv/bin/pip install --upgrade pip; \
            if [ -f requirements.txt ]; then ./.venv/bin/pip install -r requirements.txt; fi; \
            # === run with venv python (不依賴遠端腳本版本) ===
            mkdir -p logs; LOG=\"logs/ci_remote_$(date -u +%Y%m%dT%H%M%SZ).log\"; set -x; \
            ./.venv/bin/python -m scripts.ci_orchestrator \
              --csv resources/btc_15m.csv \
              --models-dir models/BTCUSDT \
              --feature-func csp.features.build_features \
              --horizon 16 \
              --lookback-days 30 \
              --target-win 0.70 \
              --target-ret 0.10 \
              --grid 0.50 0.75 0.01 \
              --fees-bps 6 \
              --slippage-bps 1 \
              2>&1 | tee -a \"\$LOG\"; \
            ./.venv/bin/python -m scripts.notify_latest_backtest 2>&1 | tee -a \"\$LOG\" || true \
          "

      # 失敗也一定會通知（讀 logs/ci_run.json）
      - name: Telegram notify (always)
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_notify_from_log

      # 也推「最新回測摘要」（優先原樣轉發 [SUMMARY ALL] {...}）
      - name: Telegram notify latest backtest (always)
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.notify_latest_backtest
